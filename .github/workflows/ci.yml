name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (no network)
        run: make test
      - name: Rebuild every number from the raw data and compare (no network)
        run: make check
      - name: Re-read a sample of days from public NEAR mainnet and compare
        run: make verify
        env:
          RPC_RATE: "1"
