# Publishes the dashboard. On every run it reads the days since the last committed reading from NEAR mainnet,
# scores the forward tests in PREREG.md and publishes the result.
# Nothing is committed from here: main changes only through pull requests, and the numbers quoted in the text
# stay pinned to the day in data/pin.json. Readings taken here are kept in a build cache between runs, so a run
# only reads the new day. Two limits: the cache is not the repository, so the readings reach it only when someone
# merges them; and GitHub pauses scheduled workflows after 60 days without repository activity.
name: dashboard
on:
  push:
    branches: [main]
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: dashboard
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bring back the readings earlier runs took
        uses: actions/cache@v4
        with:
          path: .readings
          key: readings-${{ github.run_id }}
          restore-keys: readings-
      - name: Use them where the repository has no reading for that day yet
        run: |
          mkdir -p .readings/float .readings/held
          cp -n .readings/float/*.json data/float/ 2>/dev/null || true
          cp -n .readings/held/*.json data/held/ 2>/dev/null || true
          if [ -f .readings/blocks.json ]; then python3 -c "import json; a=json.load(open('.readings/blocks.json')); b=json.load(open('data/blocks.json')); a.update(b); json.dump(a, open('data/blocks.json','w'), indent=1, sort_keys=True)"; fi
      - name: Read the days since the last reading from NEAR mainnet
        run: python3 -m pipeline.pull --held
      - name: Keep the readings for the next run
        run: |
          cp data/blocks.json .readings/blocks.json
          cp data/float/*.json .readings/float/
          cp data/held/*.json .readings/held/
      - name: Rebuild the series, the quoted numbers and the forward-test scores
        run: make build
      - run: make test
      - run: make check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
